[package]
name = "ad-binder-phys"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[[bin]]
name = "ad-binder"
path = "../../../../runtime/src/binder/phys/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
flate2 = { version = "=1.1.9", features = ["zlib-rs"] }  # integ8: zlib-rs inflate (held split blobs: 4.3-5.5 s per physics step on one core with miniz_oxide)
